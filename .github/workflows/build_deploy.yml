# ============================================================================
# Flutter Cross-Platform Build & Deploy Pipeline
# Targets: Android (APK/AAB → Google Play), iOS (IPA → TestFlight/App Store),
#          Windows (EXE/MSIX → GitHub Releases)
#
# Triggers:
#   - Manual via GitHub Actions "Run workflow" (workflow_dispatch)
#   - Automatically on tags matching v* (e.g. v1.0.0)
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
# ----------------------------------------------------------------------------
# ANDROID_RELEASE_KEYSTORE   Base64 of the release .jks keystore
# ANDROID_KEYSTORE_PASSWORD  Keystore password
# ANDROID_KEY_ALIAS          Key alias (e.g. "upload")
# ANDROID_KEY_PASSWORD       Key password
# ANDROID_SERVICE_ACCOUNT_JSON Base64 of the Google Play service-account JSON
# PLAY_PACKAGE_NAME          Android applicationId (com.soleux.sdm)
# FIREBASE_GOOGLE_SERVICES    (optional) Base64 of android google-services.json
# IOS_CERT_P12_BASE64        Base64 of the Distribution signing certificate .p12
# IOS_CERT_P12_PASSWORD      Password of the signing certificate .p12
# IOS_MOBILEPROVISION_BASE64 Base64 of the App Store distribution .mobileprovision
# IOS_MATCH_CERT_API_KEY      (optional) Base64 of the App Store Connect .p8 key
# IOS_MATCH_CERT_API_KEY_ID   (optional) App Store Connect API key ID
# IOS_MATCH_CERT_ISSUER_ID    (optional) App Store Connect API key issuer ID
# IOS_FASTLANE_USER           (optional, fallback auth) App Store Connect username
# IOS_APPLE_APP_SPECIFIC_PASSWORD (optional, fallback auth) app-specific password
# IOS_APPLE_TEAM_ID           (optional) Your Developer Team ID
# IOS_APPLE_BUNDLE_ID         iOS bundle identifier (com.soleux.sdm)
# IOS_GOOGLE_SERVICE_PLIST    (optional) Base64 of iOS GoogleService-Info.plist
# GH_RELEASE_TOKEN            (optional) PAT for Release upload (default: GITHUB_TOKEN)
# ============================================================================

name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment (APP_ENV dart-define)'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      platform:
        description: 'Platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - android
          - ios
          - windows
          - all
      deploy_android:
        description: 'Deploy AAB to Google Play (Internal testing)'
        required: false
        default: false
        type: boolean
      deploy_ios:
        description: 'Upload IPA to TestFlight'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

# Minimal permissions; checkout needs contents, releases upload needs contents.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: ${{ github.event.inputs.environment || 'prod' }}
  # Checks run unconditionally (before build selection).
  RUN_ANDROID: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android') || startsWith(github.ref, 'refs/tags/v') }}
  RUN_IOS: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios') || github.runner.os == 'macOS' }}
  RUN_WINDOWS: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') || github.runner.os == 'Windows' }}

jobs:
  # --------------------------------------------------------------------------
  # 1. Static analysis + unit tests (fast gate before any build)
  # --------------------------------------------------------------------------
  analyze:
    name: Flutter Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('pubspec.lock') }}

      - name: Enable Flutter pub cache (faster repeated installs)
        run: flutter pub get

      - name: Run code generator (riverpod, drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          dart format lib/l10n/gen
          dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis (fatal on issues)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test --coverage

  # --------------------------------------------------------------------------
  # 2. Windows executable build (fastest, runs on Windows runner)
  # --------------------------------------------------------------------------
  windows:
    name: Windows Build
    needs: analyze
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('pubspec.lock') }}
          architecture: x64

      - name: Enable Windows Desktop support
        run: flutter config --enable-windows-desktop

      - name: Restore pub dependencies
        run: flutter pub get

      - name: Generate codegen + l10n
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build Windows release executable
        run: flutter build windows --release --dart-define=APP_ENV=${{ env.APP_ENV }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist/windows
          cp -r build/windows/x64/runner/Release/. dist/windows/

      # Optional: build an MSIX package (requires msix config in pubspec).
      # - name: Build MSIX package
      #   run: |
      #     flutter pub get
      #     dart run msix:create --architecture x64 --store false

      - name: Publish Windows installer binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/

  # --------------------------------------------------------------------------
  # 3. Android build: debug APK, release APK, release AAB (signed)
  # --------------------------------------------------------------------------
  android:
    name: Android Build
    needs: analyze
    runs-on: ubuntu-latest
    env:
      # Instruct the Gradle signing block (see README) to use CI values.
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (required for current Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('pubspec.lock') }}

      - name: Restore pub dependencies
        run: flutter pub get

      - name: Generate codegen + l10n
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Recreate release keystore from secret
        if: ${{ env.ANDROID_RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ env.ANDROID_RELEASE_KEYSTORE }}" | base64 --decode > android/app/upload-keystore.jks
          echo "keystore recreated at android/app/upload-keystore.jks"

      # Optional: inject Firebase google-services.json from secret.
      - name: Recreate google-services.json
        if: ${{ env.FIREBASE_GOOGLE_SERVICES != '' }}
        run: |
          echo "${{ env.FIREBASE_GOOGLE_SERVICES }}" | base64 --decode > android/app/google-services.json

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_ENV=${{ env.APP_ENV }}

      - name: Build signed release APK
        run: flutter build apk --release --dart-define=APP_ENV=${{ env.APP_ENV }}

      - name: Build signed release App Bundle (AAB)
        run: flutter build appbundle --release --dart-define=APP_ENV=${{ env.APP_ENV }}

      - name: Publish APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      # Optional: attach binaries to the release that triggered the tag.
      - name: Upload Android assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      # Deploy AAB to Google Play Console using the service-account key.
      - name: Deploy to Google Play (Internal testing)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_android == 'true') || startsWith(github.ref, 'refs/tags/v') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAY_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew/  # optional release notes dir

  # --------------------------------------------------------------------------
  # 4. iOS: build signed IPA using a base64-encoded Distribution certificate
  #    (.p12) + provisioning profile (.mobileprovision), deploy to TestFlight.
  #    Requires a macOS runner.
  #    * deploy_ios=true or a v* tag -> fastlane `beta` lane signs + uploads.
  #    * otherwise -> unsigned IPA produced as an artifact only.
  # --------------------------------------------------------------------------
  ios:
    name: iOS Build & Deploy
    needs: analyze
    runs-on: macos-latest
    # Only run when iOS is requested (dispatch) or on a tag release.
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event.inputs.deploy_ios == 'true')) || startsWith(github.ref, 'refs/tags/v') }}
    env:
      # True when we must produce a signed build for TestFlight.
      SHOULD_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ios == 'true') || startsWith(github.ref, 'refs/tags/v') }}
      IOS_GOOGLE_SERVICE_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_PLIST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('pubspec.lock') }}

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Restore pub dependencies
        run: flutter pub get

      - name: Generate codegen + l10n
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # Optional: inject Firebase iOS config from secret (base64).
      - name: Recreate GoogleService-Info.plist
        if: ${{ env.IOS_GOOGLE_SERVICE_PLIST != '' }}
        run: |
          echo "${{ env.IOS_GOOGLE_SERVICE_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # Decode the signing certificate (.p12) + distribution provisioning
      # profile (.mobileprovision) from secrets onto the runner disk.
      - name: Stage signing certificate + provisioning profile
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p "${{ runner.temp }}/signing"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "${{ runner.temp }}/signing/distribution.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "${{ runner.temp }}/signing/distribution.mobileprovision"
          echo "Signing material staged at ${{ runner.temp }}/signing"

      # fastlane lane `beta` (ios/fastlane/Fastfile) imports the certificate
      # into the login keychain, installs the provisioning profile, builds the
      # signed IPA and uploads it to TestFlight.
      - name: Build signed IPA and upload to TestFlight
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        working-directory: ios
        env:
          IOS_CERT_P12_PATH: ${{ runner.temp }}/signing/distribution.p12
          IOS_CERT_P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          IOS_MOBILEPROVISION_PATH: ${{ runner.temp }}/signing/distribution.mobileprovision
          IOS_APPLE_BUNDLE_ID: ${{ secrets.IOS_APPLE_BUNDLE_ID }}
          APP_ENV: ${{ env.APP_ENV }}
          # Preferred: App Store Connect API key. IOS_MATCH_CERT_API_KEY is the
          # base64-encoded .p8 private key content.
          IOS_MATCH_CERT_API_KEY: ${{ secrets.IOS_MATCH_CERT_API_KEY }}
          IOS_MATCH_CERT_API_KEY_ID: ${{ secrets.IOS_MATCH_CERT_API_KEY_ID }}
          IOS_MATCH_CERT_ISSUER_ID: ${{ secrets.IOS_MATCH_CERT_ISSUER_ID }}
          # Fallback auth (when no API key is configured): App Store Connect
          # username + app-specific password.
          FASTLANE_USER: ${{ secrets.IOS_FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.IOS_APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.IOS_APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.IOS_APPLE_TEAM_ID }}
        run: bundle exec fastlane beta

      # Unsigned build for artifact-only runs (no deploy requested).
      - name: Build unsigned IPA (artifact-only)
        if: ${{ env.SHOULD_DEPLOY != 'true' }}
        run: flutter build ipa --release --no-codesign --dart-define=APP_ENV=${{ env.APP_ENV }}

      - name: Publish iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/ios/**/*.ipa
            build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload iOS IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ios/ipa/*.ipa
